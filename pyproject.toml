[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tr3ndly"
version = "0.2.0"
description = "Philippines-focused affiliate demand intelligence"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  # Claude for copy variants (structured output, refusal fallbacks). Optional at runtime:
  # without ANTHROPIC_API_KEY the deterministic template copywriter is used.
  "anthropic>=1.12,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  # HTTP client for source adapters (timeouts, retries, and MockTransport fixtures in tests).
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1"
]

[project.scripts]
tr3ndly-worker = "tr3ndly.worker:cli"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/app", "tr3ndly"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

